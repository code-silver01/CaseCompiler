services:
  # Backend FastAPI Web Service
  - type: web
    name: casecompiler-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: SESSION_TTL_HOURS
        value: "24"

  # Frontend Vite Static Site
  - type: web
    name: casecompiler-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: casecompiler-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
